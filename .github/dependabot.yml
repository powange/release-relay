# Mises à jour proposées par Dependabot, regroupées pour limiter le nombre de demandes de
# fusion : actions GitHub (épinglées par commit) chaque semaine, le reste chaque mois.
# Les versions majeures ne sont pas proposées : elles demandent une migration faite à la main
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
